name: Feature
description: Propose or track a product feature
title: "[Feature] "
labels: ["priority:p2"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What parent, child, or contributor problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - frontend
        - backend
        - ai
        - data
        - infra
        - docs
